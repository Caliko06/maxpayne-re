<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan Max Payne</title><link rel="stylesheet" href="/plan/harness/harness.css"><script src="/plan/harness/harness.js" defer></script></head>
<body><main>
<header><div class="heading"><h1 id="goal">Cargando el plan…</h1><p id="baseline" class="muted" role="status"></p></div><a class="primary launch" href="/">Abrir el juego</a></header>
<section class="hero" aria-label="Comparador">
<div class="toolbar"><div class="modes" role="group" aria-label="Modo de comparación"><button type="button" data-mode="cortina" aria-pressed="true">Cortina</button><button type="button" data-mode="parpadeo" aria-pressed="false">Parpadeo</button><button type="button" data-mode="lado" aria-pressed="false">Lado a lado</button></div><details class="zoom"><summary>Zoom</summary><div class="zoom-menu"><button type="button" data-zoom="fit">Ajustar</button><button type="button" data-zoom="1">1:1 píxel</button><button type="button" data-zoom="2">2x</button><button type="button" data-zoom="4">4x</button></div></details></div>
<div id="stage" class="stage" data-mode="cortina" data-show="after" tabindex="0" aria-label="Comparador: rueda o pellizco para acercar; arrastra para mover; doble clic para ajustar; flechas para mover la cortina; espacio para alternar el parpadeo" aria-describedby="frame-status"><div class="side before"><img id="before" alt="Baseline" draggable="false"></div><div class="side after"><img id="after" alt="Ahora" draggable="false"></div><span class="frame-label left">Baseline</span><span class="frame-label right">Ahora</span><div id="divider" role="slider" tabindex="0" aria-label="Cortina" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" aria-orientation="horizontal"><span></span></div><p id="frame-status" class="frame-status" role="status">Cargando imágenes…</p></div>
</section>
<section aria-labelledby="detail-title"><h2 id="detail-title">Detalles</h2><div id="details"><p class="muted">Cargando detalles…</p></div></section>
<section aria-labelledby="step-title"><h2 id="step-title">Pasos</h2><ul id="checks" class="checks"></ul></section>
<section class="bottom" aria-label="Material de apoyo"><details><summary>Historial</summary><div id="rounds" class="strip"></div></details><details><summary>Referencias <span class="muted">vibe, no copiar</span></summary><div id="refs" class="strip"></div></details></section>
</main></body></html>
